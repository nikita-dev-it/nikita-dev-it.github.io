<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="description" content="Cosmic Defender — a fast vertical arcade space shooter." />
  <title>Cosmic Defender</title>
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="canvas-holder">
      <canvas id="game"></canvas>
    </div>

    <div id="hud" style="display:none">
      <div class="hud-main">
        <div class="hud-box hud-box-score">
          <div class="hud-score" id="hud-score">0</div>
          <div class="hud-lvl" id="hud-lvl">LV 1</div>
        </div>
        <div class="hud-box hud-box-gold">
          <div class="hud-gold" id="hud-gold">◈ 0</div>
        </div>
        <div class="hud-box hud-box-best">
          <div class="hud-best-label" id="hud-best-label">BEST</div>
          <div class="hud-best-value" id="hud-best">0</div>
        </div>
        <div class="hud-box hud-box-hearts">
          <div id="hearts"></div>
        </div>
        <button class="hud-btn" id="pause-btn" aria-label="Pause">❚❚</button>
      </div>

      <div class="hud-combo" id="hud-combo" style="display:none">
        <span class="combo-mult" id="combo-mult">×1</span>
        <div class="combo-track">
          <div class="combo-fill" id="combo-fill"></div>
        </div>
      </div>

      <div class="hud-foot">
        <div class="hud-powerups" id="hud-powerups" style="display:none">
          <span class="pu pu-spread" id="pu-spread" style="display:none">SPREAD</span>
          <span class="pu pu-rapid"  id="pu-rapid"  style="display:none">RAPID</span>
          <span class="pu pu-shield" id="pu-shield" style="display:none">SHIELD</span>
          <span class="pu pu-bomb"   id="pu-bomb"   style="display:none">BOMB</span>
          <span class="pu pu-warp"   id="pu-warp"   style="display:none">WARP</span>
        </div>
        <div class="hud-event" id="hud-event" style="display:none"></div>
      </div>
    </div>

    <div id="center-ui" class="center-ui hidden"></div>

    <div id="loading-screen" class="overlay">
      <div class="load-inner">
        <div class="logo">COSMIC<br/>DEFENDER</div>
        <div class="bar"><span id="load-bar"></span></div>
        <div class="load-text" id="load-text">Launching…</div>
      </div>
    </div>
  </div>

  <!-- 1. VK Play iframe API (mailru.core.js) -->
  <script src="https://vkplay.ru/app/51212/static/mailru.core.js" onerror="console.warn('[VK Play] mailru.core.js failed to load — using mock')"></script>

  <!-- 2. Обёртка VK Play API (инициализирует window.vkPlayApi) -->
  <script src="js/vk-play-api.js"></script>

  <!-- 3. Игра -->
  <script src="js/audio.js"></script>
  <script src="js/main.js"></script>

  <!-- 4. Перехват покупок и рекламы через VK Play -->
  <script src="js/vk-hook.js"></script>
</body>
</html>
